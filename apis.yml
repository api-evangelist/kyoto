aid: kyoto
name: Kyoto University
description: >-
  Kyoto University (京都大学) is a national research university in Kyoto, Japan, established in 1897 and
  ranked #36 in the QS World University Rankings. It operates no developer portal, no API gateway, no
  API terms of service and no OpenAPI of its own, and this profile records that plainly. What it does
  run, on its own hosts and its own network, is a small set of genuinely institution-operated
  machine-readable surfaces: KURENAI, the Kyoto University Research Information Repository, a
  self-hosted DSpace 7.6 with an anonymous HAL+JSON REST API and an OAI-PMH 2.0 endpoint serving 15
  metadata formats including JPCOAR and junii2, holding content back to 2006; PandA, the university's
  Sakai Learning Support System, whose Entity Broker answers JSON on 53 registered entity prefixes
  and which is a live IMS LTI 1.3 platform publishing its own signing keyset alongside a working LTI
  1.1 outcomes service; and its own Shibboleth SAML 2.0 identity provider, registered in GakuNin, the
  Japanese academic federation, which participates in eduGAIN. Those surfaces sit on hosts inside
  133.3.0.0/16, registered by JPNIC to Kyoto University as KUINS, or in the university's own AWS
  account. Five of the twelve Kin Score education-regime standards are met with live evidence —
  oai-pmh, shibboleth, saml, lti and orcid — which is unusual for this cohort and entirely
  first-party. Everything else is a human-facing service: the KULINE library catalogue, the KDB
  researcher database, OpenCourseWare, and the generative-AI tooling the IIMC brokers from Google and
  Microsoft. Student information, course registration and timetable systems are behind campus
  accounts and are not public APIs.
