- aid: kyoto:kyoto-lms-api
  name: PandA Learning Support System API (Sakai Entity Broker + IMS LTI)
  description: >-
    PandA is the Kyoto University Learning Support System, a Sakai deployment operated by the
    Institute for Information Management and Communication and published by the IIMC as the
    university's own education service. Its Sakai Entity Broker at /direct self-describes 53
    registered entity prefixes and answers application/json anonymously: the tool registry returns
    all 96 registered tools with their required Sakai permissions, while session-scoped prefixes
    (site, syllabus, announcement, assignment, calendar, content, lti) return an empty collection and
    the user directory is closed with a 403. Separately, PandA is a live IMS LTI 1.3 platform — it
    publishes a JWKS of three RS256 signing keys at /imsblis/lti13/keyset — and still runs the LTI
    1.1 Basic Outcomes service, which answers with an IMS message_response envelope. No credential
    was sent to any endpoint and no authentication was attempted.
  humanURL: https://www.iimc.kyoto-u.ac.jp/en/services/education/lms
  baseURL: https://panda.ecs.kyoto-u.ac.jp
  x-operator: institution
  x-operator-evidence: >-
    panda.ecs.kyoto-u.ac.jp is under Kyoto University's own registrable domain and is published by
    the IIMC as the university's Learning Support Service at
