x-coverage:
  state: covered
  reason: institution_operated_surfaces_verified
  detail: >-
    Kyoto University operates four public machine-readable surfaces that were verified live on
    2026-08-19, all of them first-party: the KURENAI DSpace 7.6 REST API, the KURENAI OAI-PMH 2.0
    endpoint, the PandA (Sakai) Entity Broker with its IMS LTI 1.3 keyset and LTI 1.1 outcomes
    service, and its own Shibboleth SAML 2.0 identity provider registered in GakuNin. The PandA LMS
    and the SAML identity federation were both absent from the June 2026 profile and are new here;
    the REST API's baseURL was also wrong in that profile, pointing at the OAI-PMH path. No vendor
    contract is credited to this institution and none needed to be removed: the audit found six
    institution verdicts, zero tenant and zero vendor surfaces. kyoto-u.figshare.com was checked and
    rejected as wildcard DNS, not a tenancy — a nonsense control subdomain returns the identical
    HTTP 202 zero-byte response. What Kyoto does not publish is equally clear: no developer portal,
    no API gateway, no OAuth authorization server, no API keys, no changelog, no status page, no
    versioning or deprecation policy, no error reference, and no OpenAPI of its own — every
    specification in this repository was written by API Evangelist from live probes and is marked as
    such. Two surfaces are gated rather than absent and are recorded but not credited: the ORCID
    integration service ris-orcid.iimc.kyoto-u.ac.jp does not answer from the public internet, and
    the Kyoto University Generative AI Information Portal is a Google Sites page behind a
    kyoto-u.ac.jp Workspace sign-in, so no public AIPolicy pointer is claimed.
