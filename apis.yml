- aid: kyoto:sso
  name: Kyoto University Shibboleth Identity Provider (GakuNin)
  description: >-
    Kyoto University operates its own Shibboleth SAML 2.0 identity provider, run by the Institute for
    Information Management and Communication, with public machine-readable metadata at the canonical
    /idp/shibboleth location. The EntityDescriptor declares
    entityID https://authidp1.iimc.kyoto-u.ac.jp/idp/shibboleth, a shibmd:Scope of kyoto-u.ac.jp, and
    single sign-on over SAML 2.0 HTTP-POST, HTTP-Redirect and the legacy Shibboleth 1.0 profile. The
    IdP is a registered member of GakuNin, the Japanese academic access management federation operated
    by the National Institute of Informatics and an eduGAIN participant; the federation aggregate also
    carries Kyoto's supercomputer service provider,
    entityID https://web.kudpc.kyoto-u.ac.jp/shibboleth-sp, for the Academic Center for Computing and
    Media Studies. University accounts are SPS-ID (faculty and staff) and ECS-ID (students), with
    multi-factor authentication. Service-provider connections require committee approval: this is
    institutional SSO infrastructure, not a self-service API.
  humanURL: https://www.iimc.kyoto-u.ac.jp/en/services/account/auth-system
  baseURL: https://authidp1.iimc.kyoto-u.ac.jp/idp/shibboleth
  x-operator: institution
  x-operator-evidence: >-
    Both federation entities are under kyoto-u.ac.jp. The IdP metadata is served from the university's
    own AWS account (alb-authidp01-562568956.ap-northeast-1.elb.amazonaws.com) and names the IIMC as
    the operating organization with contact authidp@iimc.kyoto-u.ac.jp. Federation membership is an
    institution-operated fact by definition — no vendor sits between Kyoto University and this metadata.
  tags:
