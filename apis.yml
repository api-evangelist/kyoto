  name: KURENAI OAI-PMH API
  description: >-
    OAI-PMH 2.0 metadata harvesting interface for KURENAI, the Kyoto University Research Information
    Repository. Anonymous, verb-driven, and serving 15 metadata formats including jpcoar_2.0 and
    jpcoar_1.0 (Japan Consortium for Open Access Repositories), junii2 for NII IRDB harvesting,
    oai_dc, mods, mets, ore, didl, qdc, etdms, marc and rdf. Identify reports protocol version 2.0,
    an earliest datestamp of 2006-06-05 and deletedRecord policy "transient". Records carry ORCID,
    ROR, e-Rad and kakenhi identifiers.
