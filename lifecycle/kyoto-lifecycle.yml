description: >-
  Lifecycle posture of the machine-readable surfaces Kyoto University operates. The university
  publishes no changelog, no deprecation policy, no status page and no versioning statement for any
  of them; what can be established is the version each system reports about itself and the protocol
  version each interface speaks.
versioning:
  published_policy: none_found
  scheme: none_declared
  detail: >-
    No surface carries a version in its path or in a header, and no versioning or deprecation policy
    was found on any Kyoto University host. Consumers are on protocol versions and product releases,
    not on a contract the university has committed to.
