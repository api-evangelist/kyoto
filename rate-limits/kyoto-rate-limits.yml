description: >-
  Kyoto University publishes no rate-limit table, no quota and no throttling policy for any surface
  it operates, and none of the four institution-operated surfaces returned a rate-limit header when
  probed on 2026-08-19. The KURENAI OAI-PMH endpoint is the one that most plausibly throttles a
  large harvest; the PandA Entity Broker, the LTI keyset and the Shibboleth metadata endpoint are
  small, cheap reads. Clients should harvest politely, honor Retry-After if it ever appears, and
  contact repository@mail2.adm.kyoto-u.ac.jp for bulk access. Nothing here is a published limit.
