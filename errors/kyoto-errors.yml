generated: '2026-08-19'
method: probed
source: >-
  Observed responses from live, anonymous probes of Kyoto University-operated hosts on 2026-08-19.
  Every entry is a status code an anonymous client actually received; none is inferred from
  documentation, because none of these surfaces publishes an error reference.
provider: Kyoto University
providerId: kyoto
description: >-
  Error and boundary behaviour of the machine-readable surfaces Kyoto University operates itself.
  The university publishes no error catalogue for any of them, so this file is the observed
  contract: what each surface returns, in what media type, when a call is malformed, unauthorized
  or absent.
surfaces:
- name: PandA (Sakai) Entity Broker
  operator: institution
  base_url: https://panda.ecs.kyoto-u.ac.jp
  media_type_on_error: text/html
  structured_errors: false
  notes: >-
    Errors surface as Apache Tomcat HTML status pages, localised to Japanese, not as JSON. A client
    that requests application/json still receives HTML on failure, so callers must branch on status
    code rather than parse a body. The LTI endpoints are the exception and answer JSON.
  observed:
  - status: 200
    url: https://panda.ecs.kyoto-u.ac.jp/direct/site.json
    detail: Success with an empty collection - the anonymous result for session-scoped entities.
  - status: 400
    url: https://panda.ecs.kyoto-u.ac.jp/direct/membership.json
    detail: 'Tomcat "HTTPステータス 400 – Bad Request" HTML page when required parameters are absent.'
  - status: 401
    url: https://panda.ecs.kyoto-u.ac.jp/direct/poll.json
    detail: 'Tomcat "HTTPステータス 401 – Unauthorized" HTML page - an authenticated Sakai session is required.'
  - status: 403
    url: https://panda.ecs.kyoto-u.ac.jp/direct/user.json
    detail: 'Tomcat "HTTPステータス 403 – Forbidden" HTML page - the user directory is closed to anonymous callers.'
  - status: 404
    url: https://panda.ecs.kyoto-u.ac.jp/.well-known/jwks.json
    detail: 'Tomcat "HTTPステータス 404 – 見つかりません" HTML page. The LTI keyset is not served from the .well-known namespace.'
  - status: 500
    url: https://panda.ecs.kyoto-u.ac.jp/imsoidc/lti13/oidc_auth
    detail: >-
      Internal Server Error on a bare GET. The OIDC launch endpoint expects a full LTI 1.3 launch and
      fails hard rather than returning a 400 - the one rough edge found on this surface.
- name: PandA LTI 1.3 endpoints
  operator: institution
  base_url: https://panda.ecs.kyoto-u.ac.jp/imsblis/lti13
  media_type_on_error: application/json
  structured_errors: true
